repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
        # mkdocs.yml uses a `!!python/name:...` tag (Material for MkDocs'
        # documented way to enable native mermaid rendering via
        # pymdownx.superfences) that PyYAML's safe loader rejects as
        # non-standard. --unsafe is the standard fix for exactly this
        # MkDocs + pre-commit combination; scoped to just this file so
        # everything else still gets strict validation.
        exclude: '^mkdocs\.yml$'
    -   id: check-yaml
        name: check-yaml (mkdocs.yml, unsafe)
        files: '^mkdocs\.yml$'
        args: ['--unsafe']
    -   id: end-of-file-fixer
        # cpp/cross/include/boost is a symlink-target string (git mode 120000,
        # checked out as a plain text file since this repo runs with
        # core.symlinks=false on Windows). Its content -- "/usr/include/boost",
        # no trailing newline -- IS the symlink target: adding a newline here
        # corrupts the actual symlink once checked out for real (Linux/WSL/
        # macOS, core.symlinks=true). Confirmed reproducing 2026-08-18.
        exclude: '^cpp/cross/include/boost$'
    -   id: trailing-whitespace
-   repo: https://github.com/pre-commit/mirrors-clang-format
    rev: ''  # Use the sha / tag you want to point at
    hooks:
    -   id: clang-format
        # clang-format's mirror hook defaults to matching JS too (it can
        # format JS/TS in general), but .clang-format here has no
        # JavaScript-compatible config -- first hit when docs/assets/
        # video-embed.js became the repo's first .js file, 2026-08-23.
        exclude: '\.(json|js)$'
-   repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
    -   id: reuse
        # -X utf8: reuse's plain-text report can contain characters the
        # default Windows console codepage (cp1252) can't encode, which
        # crashes click.echo() with UnicodeEncodeError -- confirmed
        # reproducing on this machine. Python's UTF-8 mode sidesteps it
        # regardless of platform/locale; harmless where it isn't needed.
        entry: python -X utf8 -m reuse lint
        args: []
        pass_filenames: false
