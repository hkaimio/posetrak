version = 1
SPDX-PackageName = "posetrak"
SPDX-PackageSupplier = "Harri Kaimio <harri@kaimio.fi>"
SPDX-PackageDownloadLocation = "https://github.com/hkaimio/posetrak"

# Prose documentation. Kept out of per-file SPDX headers (unlike source code)
# so narrative/blog-style docs (e.g. docs/background.md) don't carry visible
# boilerplate at the top -- same license as the code either way.
[[annotations]]
path = "**/*.md"
SPDX-FileCopyrightText = "2026 Harri Kaimio"
SPDX-License-Identifier = "Apache-2.0"

# File types with no comment syntax reuse can use for a real header (JSON,
# CSV, PNG, NPZ), or types where a header risks confusing an external parser
# (.wrap is Meson-specific INI-like syntax; uv.lock is machine-generated and
# gets fully rewritten by `uv lock` anyway). Covers both real fixtures/data
# and this project's actual JSON config files (e.g. rig configs).
[[annotations]]
path = [
    "**/*.json",
    "**/*.csv",
    "**/*.png",
    "**/*.jpg",
    "**/*.jpeg",
    "**/*.gif",
    "**/*.npz",
    "**/*.wrap",
    "**/*.example",
    "**/*.txt",
    "uv.lock",
]
SPDX-FileCopyrightText = "2026 Harri Kaimio"
SPDX-License-Identifier = "Apache-2.0"

# Odd pre-existing filename with spaces (an exported marker-position CSV
# checked into the repo root) and a tracked symlink into a cross-compile
# toolchain's system headers -- neither can carry an inline header.
[[annotations]]
path = [
    "marker 3D positions from tracking_results.csv",
    "cpp/cross/include/boost",
]
SPDX-FileCopyrightText = "2026 Harri Kaimio"
SPDX-License-Identifier = "Apache-2.0"

# Bundled default skeletons: their skeletons.id is the SHA-256 of this exact
# file's bytes (content-addressed, see manage_skeleton.py), and
# capture_persons.default_skeleton_id rows elsewhere reference that id
# directly. An inline SPDX header changes the hash -- it did, in commit
# ad974b4, silently turning every fresh install's "Default male"/"Default
# female" into a *different*, new skeleton (same content) from the one any
# already-seeded registry/session has, an install-to-install drift bug only
# caught via e2e testing on 2026-08-23. Keep these two files header-free.
[[annotations]]
path = [
    "python/posetrak/data/skeletons/default_female.yaml",
    "python/posetrak/data/skeletons/default_male.yaml",
]
SPDX-FileCopyrightText = "2026 Harri Kaimio"
SPDX-License-Identifier = "Apache-2.0"

# Misc. plain-text/config files with no established comment convention reuse
# recognises, or where a header risks being read as actual content (a bare
# version string, a glob-pattern list).
[[annotations]]
path = [
    ".clang-format-ignore",
    ".python-version",
    ".vscode/settings.vscode",
    "docs/roadmap/features/hand-detection-refinement/hand-detect-test-frames.txt",
]
SPDX-FileCopyrightText = "2026 Harri Kaimio"
SPDX-License-Identifier = "Apache-2.0"

# The Posetrak logo (two master exports plus everything derived from them --
# installer icon/wizard images, docs site logo/favicon) is Nelli Kaimio's
# artwork, not Harri's -- distinct copyright holder from the rest of the
# project, though still released under the same license.
[[annotations]]
path = [
    "branding/posetrak-logo-abstract.png",
    "branding/posetrak-logo-aikido.png",
    "packaging/windows/assets/posetrak-icon.ico",
    "packaging/windows/assets/wizard-small.bmp",
    "packaging/windows/assets/wizard-banner.bmp",
    "docs/assets/logo.png",
    "docs/assets/favicon.png",
    "docs/assets/banner.png",
]
SPDX-FileCopyrightText = "2026 Nelli Kaimio"
SPDX-License-Identifier = "Apache-2.0"
