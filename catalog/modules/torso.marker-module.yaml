# Reflective markers worn on the torso: the slot names, their order and the
# joint each rides on. Matches the operator's real 2026-09-25 capture marker
# set (verbal description, not yet cross-checked against detected footage).
#
# Back: sacrum on the pelvis, one midline marker on each of spine1 and
# spine2 (both were bare in the original leg-module-style draft; the real
# marker set instruments both), and one on the neck (neck_back -- placed on
# neck1, the segment right after spine2; the operator noted this one is
# poorly visible on camera, so it may need re-placing or dropping once real
# detections are checked).
# Front: ASIS pair on the pelvis, a chest pair on spine2, and a clavicle
# pair on the shoulder joint (this skeleton's clavicle-equivalent bone,
# distinct from upper_arm -- see arm.marker-module.yaml's own shoulder_R/L,
# which rides the upper arm itself and is a different physical marker).
#
# Bilateral pairs on hips/spine1/spine2/neck1 are written as two explicit
# entries rather than `mirror: true`, since that shorthand requires a
# .R/.L-suffixed parent joint (posetrak/markers/catalog.py) and those joints
# have none in this skeleton -- only the marker name differs between the two
# sides, not the joint. The clavicle pair does use `mirror: true`: its own
# parent joint (shoulder.R/shoulder.L) is properly suffixed.
module: torso
requires_topology: reallusion-no-waist
requires_topology_hash: c962335e1aa10ef711c13f4a082ba1c188f726e9ce20afc0c542ef70a69922fe
requires_joints: [hips, spine1, spine2, neck1, shoulder]

markers:
  # Pelvis: front-left, front-right and a back midline marker.
  - {name: asis_R, parent_joint: hips, along: 0.2635, lateral: -0.0948, anterior: 0.097, normal: [0.03, -0.428, 0.903]}
  - {name: asis_L, parent_joint: hips, along: 0.237, lateral: 0.0924, anterior: 0.0963, normal: [0.14, 0.517, 0.844]}
  - {name: sacrum, parent_joint: hips, along: -0.0947, lateral: -0.0015, anterior: -0.1215, normal: [0.34, 0.137, -0.93]}
  # Spine: one back midline marker per segment, plus a front chest pair on
  # spine2 (spine1 has no front marker -- unreachable/not worn there).
  - {name: spine1_back, parent_joint: spine1, along: 0.8276, lateral: 0.0002, anterior: -0.1054, normal: [-0.167, -0.039, -0.985]}
  - {name: spine2_back, parent_joint: spine2, along: 0.4416, lateral: -0.0037, anterior: -0.1282, normal: [-0.169, 0.061, -0.984]}
  - {name: chest_R, parent_joint: spine2, along: 0.5839, lateral: -0.0901, anterior: 0.1037, normal: [0.19, -0.214, 0.958]}
  - {name: chest_L, parent_joint: spine2, along: 0.5942, lateral: 0.0853, anterior: 0.1035, normal: [0.2, 0.201, 0.959]}
  # Neck: single back marker.
  - {name: neck_back, parent_joint: neck1, along: 0.3332, lateral: -0.0023, anterior: -0.0783, normal: [0.237, 0.009, -0.971]}
  # Shoulder girdle (clavicle attachment), front.
  - {name: clavicle_R, parent_joint: shoulder.R, along: -0.1206, lateral: -0.0132, anterior: 0.0592, normal: [-0.109, 0.679, 0.726], mirror: true}
