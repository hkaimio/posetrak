# SOMA-77 marker set: where the keypoints of the SOMA-77 pose model sit relative to the bones of the default
# skeletons. The 29 body markers and the first joints of the index and little fingers (which, with the wrist, fix
# the hand's twist) are bound by landmark (soma77:<name>) and join the `main` group. The other finger keypoints are
# not tracked: from a body crop they localise at about 0.20 of the hand size, against 0.05-0.07 from a hand crop.
#
# Offsets: metres, in the frame of the parent joint of the default skeleton. Method: for each keypoint, the
# median over a calibration window of its triangulated position (cameras that see it with confidence of at least
# 0.5, heatmap cells decoded at their centres, 1.6 times the person box as crop, person-mask gate) expressed in the
# frame of the parent joint of a reference tracking run, which was independent of this model. A keypoint is a joint
# centre of the SOMA skeleton, a few centimetres from the corresponding joint of the default skeleton (the knee and
# ankle sit higher up the leg). The displacement depends on pose, so these offsets are a calibration for upright
# and squatting poses and not constants; the spread of the samples was at most 5 cm.
#
# ToeBase is the ball of the foot, where the toe joint is, so it is bound to the foot and not to the toe: bound to the
# toe it moves with the toe's rotation, which leaves the foot with the ankle keypoint alone and lets the toe joint
# take up the foot's orientation (toe bends of 30-50 degrees, foot twist at its limits). ToeEnd stays on the toe.
pose_model: soma77
group: main
markers:
- name: Hips
  parent: hips
  offset: [-0.0293, 0.0394, 0.0138]
- name: Spine1
  parent: spine1
