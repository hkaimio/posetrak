# Meson cross-compilation file: Linux host → Windows x86-64 (MinGW-w64)
#
# Prerequisites:
#   sudo apt install mingw-w64
#
# Build:
#   meson setup winbuild --cross-file cross/mingw-w64-x86_64.ini
#   meson compile -C winbuild
#
# The resulting posetrak.exe needs these DLLs alongside it:
#   libgcc_s_seh-1.dll  libstdc++-6.dll  libwinpthread-1.dll
#   libgomp-1.dll       (if OpenMP is enabled)
# Copy them from /usr/x86_64-w64-mingw32/lib/ or use windeployqt equivalent.

[binaries]
c       = 'x86_64-w64-mingw32-gcc'
cpp     = 'x86_64-w64-mingw32-g++'
ar      = 'x86_64-w64-mingw32-ar'
strip   = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkg-config = 'x86_64-w64-mingw32-pkg-config'

[host_machine]
system     = 'windows'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'

[built-in options]
# On Windows, DLLs require explicit __declspec(dllexport) decorators to export
# symbols.  The posetrak library has no such annotations, so build everything
# statically to avoid unresolved-symbol link errors in the exe.
default_library = 'static'

[properties]
# WIN32=1: MinGW predefines WIN32, but the GCC C++ stdlib (via <exception>)
# clears the builtin predefine.  Pinocchio macros.hpp uses #if WIN32 after
# including <sstream>, so the builtin has already been cleared by that point.
# A command-line -D cannot be cleared by headers, so this survives correctly.
#
# _USE_MATH_DEFINES: defines M_PI and friends in <cmath> on Windows.
#
# Pinocchio/Boost: Pinocchio's header-only templates pull in Boost (math,
# type_traits) which lives at /usr/include/boost on this Linux host.  The
# cross/include/boost symlink exposes only those Boost headers to the MinGW
# compiler, without contaminating the build with Linux glibc headers.
# WIN32=1: boost/asio/detail/config.hpp redefines WIN32 as empty which makes
# pinocchio/macros.hpp's "#if WIN32" parse as "#if " (no expression).
# A command-line -D overrides header redefinitions.
# __FUNCSIG__: pinocchio/macros.hpp sets PINOCCHIO_PRETTY_FUNCTION=__FUNCSIG__
# when WIN32 is true (expecting MSVC), but __FUNCSIG__ does not exist on GCC.
# Map it to __PRETTY_FUNCTION__ which is GCC's equivalent.
# _USE_MATH_DEFINES: required for M_PI on Windows.
cpp_args = ['-DWIN32=1', '-D__FUNCSIG__=__PRETTY_FUNCTION__', '-D_USE_MATH_DEFINES']
