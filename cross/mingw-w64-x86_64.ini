# Meson cross-compilation file: Linux host → Windows x86-64 (MinGW-w64)
#
# Prerequisites:
#   sudo apt install mingw-w64
#
# Build:
#   meson setup winbuild --cross-file cross/mingw-w64-x86_64.ini
#   meson compile -C winbuild
#
# The resulting posetrak.exe needs these DLLs alongside it:
#   libgcc_s_seh-1.dll  libstdc++-6.dll  libwinpthread-1.dll
#   libgomp-1.dll       (if OpenMP is enabled)
# Copy them from /usr/x86_64-w64-mingw32/lib/ or use windeployqt equivalent.

[binaries]
c       = 'x86_64-w64-mingw32-gcc'
cpp     = 'x86_64-w64-mingw32-g++'
ar      = 'x86_64-w64-mingw32-ar'
strip   = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkg-config = 'x86_64-w64-mingw32-pkg-config'

[host_machine]
system     = 'windows'
cpu_family = 'x86_64'
cpu        = 'x86_64'
endian     = 'little'

[properties]
# Pinocchio's header-only templates pull in Boost (math, type_traits), which
# lives at /usr/include/boost on this Linux host.  These Boost headers are
# pure C++ templates with no Linux-specific API usage, so including them from
# the host works correctly when cross-compiling for Windows.
# Only the Pinocchio include_directories in meson.build passes /usr/include,
# so other subprojects are not affected.
