[project]
name = "posetrak"
version = "0.1.0"
description = "Multi-camera skeletal motion capture tracker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.10",
    "numpy>=1.26",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.0",
    "pyyaml>=6.0",
    "rerun-sdk>=0.29.2",
    "scipy>=1.17.1",
    "toml>=0.10.2",
]

[project.scripts]
posetrak-db = "posetrak.db.cli:main"
posetrak-setup = "app.setup.main:main"
posetrak-pose = "app.pose.cli:main"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
analysis = [
    "marimo>=0.19",
    "plotly>=5.0",
]
setup-app = [
    "PySide6>=6.7",
    "pyexiftool>=0.5",
    "matplotlib>=3.8",
]
# pipeline group is GPU-heavy and never installed in CI.
# rtmlib is not on PyPI — install from git: uv add git+https://github.com/...
pipeline = [
    "ultralytics",
]
pose-app = [
    "PySide6>=6.7",
    "ultralytics>=8.0",   # YOLOv11 tracker
    "av>=12.0",           # PyAV for fast video decode
    # rtmlib installed separately (not on PyPI)
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
