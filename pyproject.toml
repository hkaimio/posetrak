[project]
name = "posetrak"
version = "0.1.0"
description = "Multi-camera skeletal motion capture tracker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "av>=12.0",
    "click>=8.0",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.0",
    "PySide6>=6.7",
    "pyyaml>=6.0",
    "rtmlib>=0.0.15",
    "scipy>=1.17.1",
    "lap>=0.5.12",
    "ultralytics>=8.0",
    # onnxruntime-gpu satisfies rtmlib's onnxruntime requirement at runtime
    # (same import namespace). Pin to <1.26 while the system has CUDA 12.x;
    # 1.26+ requires CUDA 13 (cublasLt64_13.dll).
    "onnxruntime-gpu>=1.19,<1.26",
]

[project.scripts]
posetrak    = "posetrak.cli.main:main"
posetrak-db = "posetrak.cli.main:main"   # backwards-compatible alias
posetrak-ui = "app.ui.main:main"
posetrak-setup = "app.setup.main:main"  # backwards-compat alias
posetrak-pose = "app.pose.cli:main"
posetrak-mcp = "app.mcp.server:main"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"posetrak.data.skeletons" = ["*.yaml"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
segmentation = [
    "cutie",
    # Pin torch so uv picks the CUDA 12.6 wheel via [tool.uv.sources] above
    # instead of pulling 2.10.0+cpu from PyPI as a cutie transitive dep.
    "torch>=2.7,<2.10",
    "torchvision",
]
analysis = [
    "marimo>=0.19",
    "plotly>=5.0",
]
tools = [
    "rerun-sdk>=0.29.2",
]
mcp-server = [
    "mcp>=1.0",
]
usd = [
    "usd-core>=24.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["python/tests"]
