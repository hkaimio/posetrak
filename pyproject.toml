[project]
name = "posetrak"
version = "0.1.0"
description = "Multi-camera skeletal motion capture tracker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "av>=12.0",
    "certifi>=2024.0",
    "click>=8.0",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "opencv-python>=4.13.0.92",
    "pandas>=3.0.0",
    "PySide6>=6.7",
    "pyyaml>=6.0",
    "rtmlib>=0.0.15",
    "scipy>=1.17.1",
    "lap>=0.5.12",
    # onnxruntime-gpu satisfies rtmlib's onnxruntime requirement at runtime
    # (same import namespace). Pin to <1.26 while the system has CUDA 12.x;
    # 1.26+ requires CUDA 13 (cublasLt64_13.dll).
    "onnxruntime-gpu>=1.19,<1.26",
]

[project.scripts]
posetrak    = "posetrak.cli.main:main"
posetrak-db = "posetrak.cli.main:main"   # backwards-compatible alias
posetrak-ui = "app.ui.main:main"
posetrak-setup = "app.setup.main:main"  # backwards-compat alias
posetrak-pose = "app.pose.cli:main"
posetrak-mcp = "app.mcp.server:main"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"posetrak.data.skeletons" = ["*.yaml"]
"posetrak.db.sql" = ["*.sql", "migrations/*.sql"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
segmentation = [
    # Pin torch so uv picks the CUDA 12.6 wheel via [tool.uv.sources] above
    # instead of pulling 2.10.0+cpu from PyPI as a cutie transitive dep.
    "torch>=2.7,<2.10",
    "torchvision",
    "omegaconf",
    "hydra-core",
    "timm",
    # SAM2 for interactive/automatic segmentation-init masks (Apache-2.0;
    # replaces ultralytics.SAM -- see docs/license-analysis.md). The PyPI
    # "sam2" package is a third-party repackaging of Meta's own source
    # (unmodified, Meta's original copyright headers intact) -- not an
    # official Meta-maintained PyPI release.
    "sam2>=1.1.0",
    # huggingface_hub powers sam2's build_sam2_hf()/build_sam2_video_predictor_hf()
    # checkpoint auto-download; sam2 itself doesn't declare it as a hard
    # dependency since the import is lazy.
    "huggingface_hub",
]
analysis = [
    "marimo>=0.19",
    "plotly>=5.0",
]
tools = [
    "rerun-sdk>=0.29.2",
]
mcp-server = [
    "mcp>=1.0",
]
usd = [
    "usd-core>=24.0",
]
docs = [
    "mkdocs-material>=9.5",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.uv]
# rtmlib declares a hard dependency on plain "onnxruntime", but we want
# onnxruntime-gpu instead (see the dependencies list above) -- both
# packages install files into the same "onnxruntime" import namespace,
# so having pip/uv install both leaves a version-mismatched mix of files
# on disk (ImportError: cannot import name 'OrtDeviceVendorId' from
# onnxruntime.capi.onnxruntime_inference_collection, seen 2026-08-15).
# This override makes uv treat rtmlib's "onnxruntime" requirement as
# never needing to be installed as its own package, since
# onnxruntime-gpu already satisfies the import at runtime.
override-dependencies = [
    "onnxruntime; sys_platform == 'never'",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
