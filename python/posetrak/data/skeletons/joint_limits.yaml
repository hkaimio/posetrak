# Joint limits of the default skeletons, in radians, per joint and axis: [lower, upper].
#
# The three values of a ball joint are the components of its rotation vector in the joint's rest frame; y runs
# along the bone (twist). Of the other two axes, x is the flexion axis of the hinge joints (knee, elbow,
# fingers) and z their side-bend axis. In the hand frame the roles are the other way round: x is the palm normal
# (radial and ulnar deviation) and z the axis across the palm (flexion and extension). A limit of [0, 0] locks
# the axis.
#
# Hinge joints (knee, elbow, the interphalangeal joints of the fingers) bend about x only: their y and z are
# locked, and tests/skeleton/test_joint_limits.py fails when one gains off-axis range. The twist of the forearm
# (pronation and supination) is not at the elbow but at the wrist joint (hand.*), where the markers on the wrist
# and on the bases of the index and little fingers observe it.
#
# Sources of the changes against the earlier table, which had +-90 degrees on the off-axis limits of knee and
# elbow and a wrist twist of +-30 degrees:
#   knee   (shin.*)     flexion 0..155 degrees, no side bend or twist
#   elbow  (forearm.*)  flexion 0..140 degrees, no side bend or twist
#   wrist  (hand.*)     flexion/extension (z) +-70 degrees, twist (y) +-85 degrees, deviation (x) +-25 degrees
