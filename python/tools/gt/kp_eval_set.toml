# Frozen evaluation set for keypoint candidates and the pose-model pipeline.
#
# Everything the acceptance runs score is named here: the labelled ranges, the failure-event list, the
# scoring script and the reference tracking runs. The data itself (labels, candidate files, events) is
# capture data and stays outside the repository: a directory given by --root or $POSETRAK_KP_EVAL_ROOT,
# whose files are listed with their SHA-256 in `checksums`. Subjects are the segmentation mask labels of
# the multi-person trial. Never edit a frozen file; a new set gets a new `name` and directory.

[evaluation_set]
name = "multi-person-ukemi-v1"
scoring_script = "python/tools/gt/eval_kp_candidates.py"
checksums = "SHA256.json"
events = "events.json"          # list of {id, subject, t0, t1, part, note}; times in s on the capture timeline
failure_flag_cm = 40.0          # a baseline-versus-variant joint distance of at least this flags a failure window
tolerance_box_height = 0.03     # a pick is correct when within this share of the person's box height of the label
same_candidate_px = 0.5         # a pick is the label's candidate when this close to the label's position

# The tracking runs below live in the session database given by --db or $POSETRAK_KP_EVAL_DB, which the
# scoring script opens read-only.

# Windows (s) where picks fail most; both ranges are scored inside them and outside them.
[[hard_windows]]
t0 = 53.0
t1 = 54.5

[[hard_windows]]
t0 = 54.9
t1 = 56.4

# Labelled ranges. `units` is the key of the done list in the units file; the candidate and label files
# are `candidates_subject<N>.npz`, `labels_subject<N>.npz` and `units_subject<N>.json` in `dir`.
# `skip_cameras` are camera indices (order of the candidate file's camera list) that were not labelled.
[ranges.range1]
dir = "range1"
units = "43.5-47.5"
t0 = 43.5
t1 = 47.5
subjects = [1, 3]
skip_cameras = { "1" = [3] }

[ranges.range3]
dir = "range3"
units = "51.7-56.8"
t0 = 51.7
t1 = 56.8
subjects = [1, 2]
skip_cameras = { "1" = [3], "2" = [3] }

# Tracking runs (id prefixes in the session database). `reference` is the run fed with the operator's labels
# on the complete observation data of range 3; `baseline` and `proposal` are the strongest-peak and the
# automatic-proposal runs over the whole trial that the failure events were judged on.
[tracker.reference]
"1" = "293c9ef1"
"2" = "9415a655"

[tracker.baseline]
"1" = "738135bb"
"2" = "5d4ec8d7"
"3" = "573d906c"

[tracker.proposal]
"1" = "d2381ac4"
"2" = "8c6bfcaf"
"3" = "5c7fee16"

# Proposal runs of range 3 built from complete observation data, the ones scored against `reference`.
[tracker.proposal_range3]
"1" = "908e75e4"
"2" = "eb7ade35"
