# Test configuration for hierarchical tracker config loading.
# Paths don't need to exist on disk — this fixture is used by load() only,
# not validate().

[data]
skeleton = "tests/data/simple_humanoid.yaml"
cameras = "tests/data/pose2sim_camera_calib.toml"
observations_dir = "tests/data/openpose"
person_id = 1
active_joint_groups = ["main", "HandL", "HandR"]

[tracking]
process_noise_std = 0.4
measurement_noise_std = 3.0
outlier_threshold = 5.0

[tracking.initialization]
ik_max_iterations = 500
ik_tolerance = 0.01
init_position_std = 0.2
init_orientation_std = 0.15
init_joint_std = 0.05
init_velocity_std = 0.05
min_cameras_for_init = 3

[tracking.ukf]
alpha = 0.3
beta = 2.0
kappa = 0.0

[output]
directory = "tracking_output_test"
export_tracking_results = true
export_statistics = false
export_debug = true

[processing]
start_time = 1.0
end_time = 10.0
tracker_fps = 50.0

[hierarchical]
enabled = true
enable_sync = true
sync_covariance = false
parent_joint_groups = ["main"]
parent_observation_groups = ["main"]
parent_process_noise_std = 0.5
parent_measurement_noise_std = 2.0
parent_outlier_threshold = 4.0

[[hierarchical.children]]
name = "HandR"
joint_groups = ["HandR"]
observation_groups = ["HandR"]
process_noise_std = 0.1
measurement_noise_std = 1.5
outlier_threshold = 3.5
min_inliers_ratio = 0.4
max_innovation_norm = 150.0

[[hierarchical.children]]
name = "HandL"
joint_groups = ["HandL"]
observation_groups = ["HandL"]
process_noise_std = 0.15
measurement_noise_std = 1.8
outlier_threshold = 3.8
min_inliers_ratio = 0.35
max_innovation_norm = 180.0
