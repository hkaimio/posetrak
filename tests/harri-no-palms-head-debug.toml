# Step 0 baseline — parent-only tracking with active_joint_groups = ["main"]
# No palm joints in "main" group. No child_filters configured.
# Output: tracking_tests/rebuild-step0/

[data]
skeleton = "tests/data/harri-skeleton-bisect-testing.yaml"
cameras = "/mnt/d/mocap/2026-01-11-kotegaesh-joint-space-test/Calib_scene.toml"
observations_dir = "/mnt/d/mocap/2026-01-11-kotegaesh-joint-space-test/pose"
sync = "tests/cpp-python/sync_cpp-python-full.json"
person_id = 0
active_joint_groups = ["main"]

[tracking]
