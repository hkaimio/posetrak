# CP2 DoD test — track Harri with Harri's scalable skeleton in calibration mode.
# Prismatic DOFs for spine/neck/arm/leg bones should drift from 0 toward
# (nominal_bone_length − actual_bone_length) over the calibration sequence.
# Check state_vectors.csv: prismatic DOF columns should show clear drift,
# not stay at zero. Marker residuals should decrease as the filter adapts.

[data]
skeleton = "harri-skeleton-bisect-testing-scalable.yaml"
cameras = "/mnt/d/mocap/2026-01-11-kotegaesh-joint-space-test/Calib_scene.toml"
observations_dir = "/mnt/d/mocap/2026-01-11-kotegaesh-joint-space-test/pose"
sync = "tests/cpp-python/sync_cpp-python-full.json"
person_id = 0
active_joint_groups = ["main", "HandL", "HandR"]

[tracking]
process_noise_std = 0.15
measurement_noise_std = 20.0
outlier_threshold = 4.0

[tracking.initialization]
ik_max_iterations = 1000
ik_tolerance = 0.02
init_position_std = 1.0
init_orientation_std = 1.0
init_joint_std = 0.1
init_velocity_std = 1.0
min_cameras_for_init = 2

[tracking.ukf]
alpha = 0.1
beta = 2.0
kappa = 0.0

[calibration]
enabled = true
prismatic_process_noise_std = 0.0001   # 0.1 mm/sqrt(s) — bone lengths drift slowly

[output]
directory = "/home/harri/projects/posetrak/tracking_tests/cp2-calibrate-harri"
export_tracking_results = true
export_statistics = true

[processing]
start_time = 0.0
end_time = 8.0
tracker_fps = 120.0
